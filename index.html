<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sonore sketch</title>
  <meta name="description" content="Draw on a picture of sound and hear the result, with sonore.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app/style.css">
  <script type="module" src="app/main.js"></script>
</head>
<body>
  <header class="bar">
    <h1>sonore sketch</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" class="active" aria-selected="true" data-tab="tracks" title="Formant, F0 and amplitude tracks, synthesized by Klatt's synthesizer (TrackDraw; Assmann et al., 1994)">Tracks</button>
      <button role="tab" disabled title="Not built yet: a spectrogram painted on time × log-frequency">Painted</button>
      <button role="tab" disabled title="Not built yet: a mask painted over a recording's spectrogram">Mask</button>
      <button role="tab" disabled title="Not built yet: needs sonore 0.5 (ModulationSpectrum.from_blobs)">Blobs</button>
      <button role="tab" disabled title="Not built yet: needs sonore 0.5 (ModulationSpectrum.with_gain)">Edit</button>
    </nav>
    <div class="controls">
      <button type="button" id="play" class="primary" title="Play or stop (Space)" disabled>▶ Play</button>
      <label class="duration" title="Length of the sound, up to 10 s. Changing it stretches what is drawn.">
        <input type="number" id="duration" min="0.05" max="10" step="0.05" value="0.6"> s
      </label>
      <label class="check" title="Hear each change as soon as it is drawn (sounds up to 3 s)"><input type="checkbox" id="autoplay" checked> Auto-play</label>
      <button type="button" id="reset" title="Start again from the default drawing (Undo brings yours back)">Reset</button>
      <button type="button" id="undo" title="Undo (Ctrl+Z)">↶</button>
      <button type="button" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button type="button" id="open" title="Open a saved drawing (.json)">Open</button>
      <button type="button" id="save" title="Save the drawing as JSON">Save</button>
      <button type="button" id="link" title="Copy a link that opens this drawing">Link</button>
      <button type="button" id="wav" title="Save the sound as a WAV file" disabled>WAV</button>
      <button type="button" id="log-toggle" title="Show what the page did and any errors" aria-expanded="false">Log</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <section class="tab-body" id="tab-tracks"></section>
    <section class="result">
      <div class="result-row">
        <span class="result-label">Result</span>
        <canvas id="waveform"></canvas>
      </div>
      <div class="result-row">
        <span class="result-label">0–8 kHz</span>
        <canvas id="spectrogram"></canvas>
      </div>
    </section>
    <section class="log" id="log" hidden>
      <div class="log-head">
        <strong>Log</strong>
        <span class="log-note">Errors and what the page did. Copy includes the versions and the current drawing, for a bug report.</span>
        <button type="button" id="log-copy">Copy</button>
        <button type="button" id="log-clear">Clear</button>
      </div>
      <pre id="log-lines"></pre>
    </section>
  </main>
  <footer class="status">
    <span id="status" role="status">Starting…</span>
    <span id="versions"></span>
  </footer>
</body>
</html>
